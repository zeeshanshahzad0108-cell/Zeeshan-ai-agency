name: Stark Automated Cloud Data Factory

on:
  schedule:
    - cron: '0 * * * *' # 🚀 Every single hour, 24/7, permanently!
  workflow_dispatch: # Allows manual execution trigger from your mobile phone

jobs:
  harvest_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Private Code Infrastructure
      uses: actions/checkout@v4

    - name: Set Up Python High-Compute Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Network Request Core
      run: pip install requests

    - name: Execute Shielded AI Extraction Engine
      run: python stark_ghost_scraper.py

    - name: Commit and Secure Fresh Ingested Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Stark Cloud Core"
        git add Stark_Premium_Data_Vault.csv
        git diff --quiet && git diff --staged --quiet || git commit -m "Autonomous Sky Harvest - 100% Verified Entry Logs Added"
        git push origin main
